replicaCount: 2

image:
  repository: 541739678686.dkr.ecr.us-east-1.amazonaws.com/devops-python-app
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: ecr-secret

service:
  type: NodePort
  port: 5000
  nodePort: 30080

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
